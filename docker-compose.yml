services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-isp888}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-isp888}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-isp888}:${MONGO_PASSWORD:-devpassword}@mongo:27017/${MONGO_DATABASE:-isp888}?authSource=admin
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_BASE_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  mongo-data:
